<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DentalBuddy 3D</title>


<!-- THREE.JS IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: #06111f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}


/* HEADER */

header {
  padding: 20px;
  background: linear-gradient(
    135deg,
    #102a43,
    #087f8c
  );
}

h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  color: #d5e5ed;
  margin-bottom: 0;
}


/* 3D VIEWER */

#viewer {
  width: 100%;
  height: 60vh;
  min-height: 400px;
  touch-action: none;
  overflow: hidden;
}


/* BUTTON AREA */

.controls {
  padding: 12px 10px;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 12px;
  background: #19b8ca;
  color: white;
  font-weight: bold;
  margin: 4px;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}


/* INFORMATION */

.info {
  padding: 8px 20px 30px;
}

.info h2 {
  margin-bottom: 8px;
}

.info p {
  color: #b7c7d5;
  line-height: 1.6;
}


/* LABELS */

.tooth-label {
  color: white;
}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<h1>🦷 DentalBuddy 3D</h1>

<p>
Interactive Tooth Explorer
</p>

</header>


<!-- 3D VIEWER -->

<div id="viewer"></div>


<!-- CONTROLS -->

<div class="controls">

<button onclick="externalView()">
External
</button>

<button onclick="sectionView()">
Section
</button>

<button onclick="pulpView()">
Pulp
</button>

<br>

<button onclick="toggleLabels()">
🏷 Labels
</button>

<button onclick="toggleAutoRotate()">
🔄 Auto Rotate
</button>

<button onclick="resetView()">
↩ Reset
</button>

</div>


<!-- INFORMATION -->

<div class="info">

<h2>
3D Tooth Explorer
</h2>

<p>
👆 Drag to rotate<br>
🤏 Pinch to zoom
</p>

</div>



<script type="module">


/* =====================================
   THREE.JS
===================================== */

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';



/* =====================================
   CONTAINER
===================================== */

const container =
document.getElementById("viewer");



/* =====================================
   SCENE
===================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x06111f);



/* =====================================
   CAMERA
===================================== */

const camera =
new THREE.PerspectiveCamera(
  45,
  container.clientWidth /
  container.clientHeight,
  0.1,
  100
);

camera.position.set(
  0,
  1.2,
  5
);



/* =====================================
   RENDERER
===================================== */

const renderer =
new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

container.appendChild(
  renderer.domElement
);



/* =====================================
   LIGHTING
===================================== */

const ambientLight =
new THREE.AmbientLight(
  0xffffff,
  2
);

scene.add(ambientLight);


const mainLight =
new THREE.DirectionalLight(
  0xffffff,
  3
);

mainLight.position.set(
  3,
  5,
  4
);

scene.add(mainLight);


const fillLight =
new THREE.DirectionalLight(
  0xffffff,
  1.5
);

fillLight.position.set(
  -3,
  2,
  4
);

scene.add(fillLight);



/* =====================================
   MAIN TOOTH GROUP
===================================== */

const toothGroup =
new THREE.Group();

scene.add(toothGroup);



/* =====================================
   ENAMEL / CROWN
===================================== */

const crownGeometry =
new THREE.SphereGeometry(
  1.25,
  64,
  64
);

const enamelMaterial =
new THREE.MeshStandardMaterial({
  color: 0xf7f3df,
  roughness: 0.25,
  metalness: 0
});

const crown =
new THREE.Mesh(
  crownGeometry,
  enamelMaterial
);

crown.scale.set(
  1,
  1.15,
  0.9
);

crown.position.y =
0.7;

toothGroup.add(crown);



/* =====================================
   DENTIN
===================================== */

const dentinGeometry =
new THREE.SphereGeometry(
  0.98,
  48,
  48
);

const dentinMaterial =
new THREE.MeshStandardMaterial({
  color: 0xe2c995,
  roughness: 0.5
});

const dentin =
new THREE.Mesh(
  dentinGeometry,
  dentinMaterial
);

dentin.scale.set(
  1,
  1.2,
  0.9
);

dentin.position.y =
0.7;

dentin.visible =
false;

toothGroup.add(dentin);



/* =====================================
   ROOT GROUP
===================================== */

const rootGroup =
new THREE.Group();

toothGroup.add(rootGroup);



/* =====================================
   ROOT FUNCTION
===================================== */

function createRoot(
  x,
  rotation
) {

  const geometry =
  new THREE.ConeGeometry(
    0.28,
    2.2,
    48
  );

  const material =
  new THREE.MeshStandardMaterial({
    color: 0xe5dfc9,
    roughness: 0.4
  });

  const root =
  new THREE.Mesh(
    geometry,
    material
  );

  root.position.set(
    x,
    -1.0,
    0
  );

  root.rotation.z =
  rotation;

  rootGroup.add(root);

}



/* CREATE ROOTS */

createRoot(
  -0.55,
  -0.12
);

createRoot(
  0,
  0
);

createRoot(
  0.55,
  0.12
);



/* =====================================
   PULP CHAMBER
===================================== */

const pulpGeometry =
new THREE.SphereGeometry(
  0.42,
  32,
  32
);

const pulpMaterial =
new THREE.MeshStandardMaterial({
  color: 0xd94b4b,
  transparent: true,
  opacity: 0.9
});

const pulp =
new THREE.Mesh(
  pulpGeometry,
  pulpMaterial
);

pulp.scale.set(
  0.7,
  1.5,
  0.7
);

pulp.position.y =
0.5;

toothGroup.add(pulp);



/* =====================================
   ROOT CANALS
===================================== */

const canalMaterial =
new THREE.MeshStandardMaterial({
  color: 0xe45b5b
});


function createCanal(x) {

  const geometry =
  new THREE.CylinderGeometry(
    0.07,
    0.04,
    1.8,
    20
  );

  const canal =
  new THREE.Mesh(
    geometry,
    canalMaterial
  );

  canal.position.set(
    x,
    -0.65,
    0
  );

  toothGroup.add(canal);

  return canal;

}


const canal1 =
createCanal(-0.55);

const canal2 =
createCanal(0);

const canal3 =
createCanal(0.55);



/* =====================================
   INITIAL VISIBILITY
===================================== */

dentin.visible = false;

canal1.visible = false;
canal2.visible = false;
canal3.visible = false;



/* =====================================
   LABELS
===================================== */

const labels = [];


function createLabel(
  text,
  x,
  y,
  z
) {

  const canvas =
  document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 128;

  const ctx =
  canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    512,
    128
  );

  ctx.fillStyle =
  "white";

  ctx.font =
  "bold 42px Arial";

  ctx.fillText(
    text,
    20,
    75
  );


  const texture =
  new THREE.CanvasTexture(
    canvas
  );


  const material =
  new THREE.SpriteMaterial({
    map: texture,
    transparent: true
  });


  const sprite =
  new THREE.Sprite(
    material
  );


  sprite.position.set(
    x,
    y,
    z
  );


  sprite.scale.set(
    1.4,
    0.35,
    1
  );


  sprite.visible =
  false;


  scene.add(sprite);

  labels.push(sprite);

}


/* LABELS */

createLabel(
  "Enamel",
  1.5,
  1.2,
  0
);

createLabel(
  "Dentin",
  1.5,
  0.35,
  0
);

createLabel(
  "Pulp",
  1.3,
  0.1,
  0
);

createLabel(
  "Root Canal",
  1.5,
  -1.1,
  0
);



/* =====================================
   ORBIT CONTROLS
===================================== */

const controls =
new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping =
true;

controls.dampingFactor =
0.08;

controls.enablePan =
false;

controls.minDistance =
3;

controls.maxDistance =
8;



/* =====================================
   STATE
===================================== */

let labelsVisible =
false;

let autoRotate =
false;



/* =====================================
   EXTERNAL VIEW
===================================== */

window.externalView =
function() {

  crown.visible =
  true;

  dentin.visible =
  false;

  pulp.visible =
  true;

  canal1.visible =
  false;

  canal2.visible =
  false;

  canal3.visible =
  false;

};



/* =====================================
   SECTION VIEW
===================================== */

window.sectionView =
function() {

  crown.visible =
  false;

  dentin.visible =
  true;

  pulp.visible =
  true;

  canal1.visible =
  true;

  canal2.visible =
  true;

  canal3.visible =
  true;

};



/* =====================================
   PULP VIEW
===================================== */

window.pulpView =
function() {

  crown.visible =
  false;

  dentin.visible =
  false;

  pulp.visible =
  true;

  canal1.visible =
  true;

  canal2.visible =
  true;

  canal3.visible =
  true;

};



/* =====================================
   LABEL TOGGLE
===================================== */

window.toggleLabels =
function() {

  labelsVisible =
  !labelsVisible;

  labels.forEach(
    function(label) {

      label.visible =
      labelsVisible;

    }
  );

};



/* =====================================
   AUTO ROTATE
===================================== */

window.toggleAutoRotate =
function() {

  autoRotate =
  !autoRotate;

};



/* =====================================
   RESET
===================================== */

window.resetView =
function() {

  camera.position.set(
    0,
    1.2,
    5
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();


  toothGroup.rotation.set(
    0,
    0,
    0
  );


  externalView();

};



/* =====================================
   RESIZE
===================================== */

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
    container.clientWidth /
    container.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

  }
);



/* =====================================
   ANIMATION
===================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  if (autoRotate) {

    toothGroup.rotation.y +=
    0.005;

  }


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
</html>
