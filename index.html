<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentalBuddy 3D</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#06111f;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:20px;
  background:linear-gradient(135deg,#102a43,#087f8c);
}

h1{
  margin:0;
  font-size:26px;
}

p{
  color:#b7c7d5;
}

#viewer{
  width:100%;
  height:70vh;
  min-height:450px;
  touch-action:none;
}

.info{
  padding:15px 20px 30px;
}

button{
  padding:13px 20px;
  border:0;
  border-radius:12px;
  background:#19b8ca;
  color:white;
  font-weight:bold;
  margin:5px;
}
</style>
</head>

<body>

<header>
<h1>🦷 DentalBuddy 3D</h1>
<p>Interactive Tooth Explorer</p>
</header>

<div id="viewer"></div>

<div class="info">
<h2>3D Tooth Explorer</h2>

<p>
👆 Drag to rotate<br>
🤏 Pinch to zoom
</p>

<button onclick="resetView()">Reset View</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const container =
document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x06111f);

const camera =
new THREE.PerspectiveCamera(
45,
container.clientWidth /
container.clientHeight,
0.1,
100
);

camera.position.set(0,1.5,5);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
container.clientWidth,
container.clientHeight
);

container.appendChild(renderer.domElement);


/* LIGHTING */

const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);

const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(3,5,4);

scene.add(light);


/* TOOTH */

const toothGroup =
new THREE.Group();

scene.add(toothGroup);


/* Crown */

const crownGeometry =
new THREE.SphereGeometry(
1.25,
64,
64
);

const toothMaterial =
new THREE.MeshStandardMaterial({
color:0xf4f1df,
roughness:.3,
metalness:0
});

const crown =
new THREE.Mesh(
crownGeometry,
toothMaterial
);

crown.scale.set(
1,
1.15,
.9
);

crown.position.y=.7;

toothGroup.add(crown);


/* Roots */

function createRoot(
x,
rotation
){

const geometry =
new THREE.ConeGeometry(
.28,
2.2,
48
);

const material =
new THREE.MeshStandardMaterial({
color:0xe5dfc9,
roughness:.4
});

const root =
new THREE.Mesh(
geometry,
material
);

root.position.set(
x,
-1.0,
0
);

root.rotation.z =
rotation;

toothGroup.add(root);
}

createRoot(-.55,-.12);
createRoot(0,0);
createRoot(.55,.12);


/* Pulp */

const pulpGeometry =
new THREE.SphereGeometry(
.42,
32,
32
);

const pulpMaterial =
new THREE.MeshStandardMaterial({
color:0xd94b4b,
transparent:true,
opacity:.9
});

const pulp =
new THREE.Mesh(
pulpGeometry,
pulpMaterial
);

pulp.scale.set(
.7,
1.5,
.7
);

pulp.position.y=.5;

toothGroup.add(pulp);


/* CONTROLS */

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;

controls.minDistance=3;
controls.maxDistance=8;


/* RESET */

window.resetView=function(){

camera.position.set(
0,
1.5,
5
);

controls.target.set(
0,
0,
0
);

controls.update();

};


/* RESIZE */

window.addEventListener(
"resize",
()=>{

camera.aspect =
container.clientWidth /
container.clientHeight;

camera.updateProjectionMatrix();

renderer.setSize(
container.clientWidth,
container.clientHeight
);

});


/* ANIMATION */

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
